# Per-distribution FPTaylor optimizer defaults, benchmarked by
# sweep_fptaylor.py (one representative point per distribution: binomial
# n=10900 p=0.1; poisson lambda=40; hypergeometric N=100 K=40 n=30).
#
# main.py applies these automatically (see dist_common.apply_settings_defaults,
# called from main.py right after argparse.parse_args()) -- any of these
# fields you pass explicitly on the command line (--approx/--no-approx,
# --bb-eval/--no-bb-eval, --v-trunc, --u-trunc, --opt-x-abs-tol,
# --opt-x-abs-tol-vars, --floor-opt-x-abs-tol-vars,
# --accept-opt-x-abs-tol-vars) always override the value here. A
# distribution with no section below (or this file missing entirely) falls
# back to the original hardcoded defaults (approx=true, bb_eval=false,
# v_trunc=2^-53, u_trunc=0.0).
#
# Key finding: the fastest {opt bb vs bb-eval} x {approx vs no-approx}
# combination is NOT universal -- it flips direction by distribution:
#   - binomial, poisson: compiled `--opt bb` under `--approx` triggers a
#     SEPARATE OCaml compile per per-operation error term (confirmed via
#     live process monitoring: 30+ bb_N.ml compiles for one query), making
#     it ~12x slower than --no-approx (--opt-exact, one compile, one
#     harder joint optimization). --no-approx wins for both.
#   - hypergeometric: the opposite. --no-approx's single joint optimization
#     never converges (900s+, confirmed hung) -- the joint accept
#     expression combining several lgamma terms is apparently too hard for
#     branch-and-bound to close in one shot. --approx (decomposed
#     per-term) is required for this one to finish at all, and the
#     interpreted --bb-eval backend edges out compiled --opt bb here
#     (26.8s vs 38.4s) since there's no compile-multiplication penalty to
#     avoid and bb-eval's per-box thread parallelism (--jobs) helps instead.
#
# Re-run/extend this sweep with sweep_fptaylor.py if these numbers ever
# need re-validating (e.g. after an FPTaylor upgrade or a template change).

# Cross-distribution constants (analyticError.load_global_settings): the
# per-format mantissa precision used by every --fp choice, and the lambda
# threshold Poisson's analytic TV bound (and dist_poisson/dist_poisson_stable/
# fpsampler/computeLRError's low-vs-high-range split) switches on. Missing
# here (or this file missing entirely) falls back to analyticError's own
# hardcoded defaults.
[global]
switch = 30

[global.fp_beta]
fp32 = 24    # IEEE 754 binary32
fp64 = 53    # IEEE 754 binary64
fp128 = 112  # IEEE 754 binary128
fp256 = 237  # IEEE 754 binary256 (octuple)

[binomial]
switch = 30.0  # n*p threshold: legacy inversion below, BTRS above (dist_binomial._BTRS_SWITCH)
approx = false
bb_eval = true #false bb not working in cluster -> bb_eval=true
v_trunc = 1e-20
u_trunc = 1e-5
opt_x_abs_tol = 0.01
floor_opt_x_abs_tol_vars = "u=1e-5,n=1e5,p=0.1"
# k=1: k is now declared directly over [0,n] (see make_btrs_accept_template)
# instead of derived from u, and defaults to the flat opt-x-abs-tol=0.01 --
# a needlessly tight resolution relative to k's own [0,n] range (k is
# conceptually integer-valued; sub-1 precision buys nothing). Confirmed:
# without this, n=100 p=0.5 didn't converge in 60s+; with it, ~24s.
accept_opt_x_abs_tol_vars = "u=0.1,n=1e5,p=0.1,f=1,fm=1,k=1"

[poisson]
approx = false
bb_eval = true #false bb not working in cluster -> bb_eval=true
v_trunc = 1e-20
u_trunc = 1e-5
opt_x_abs_tol = 0.01
floor_opt_x_abs_tol_vars = "u=1e-6"
accept_opt_x_abs_tol_vars = "u=0.1"

[hypergeometric]
switch = 10  # sample-count threshold: HYP below, HRUA above (dist_hypergeometric._HRUA_SWITCH)
approx = true
bb_eval = true
opt_x_abs_tol = 0.01
# u_trunc: floor on X (the ratio-of-uniforms proposal variable) below which
# the domain is clipped rather than analyzed, charged flatly to TV -- same
# role as binomial/poisson's u_trunc. Was a hardcoded 1e-4 in
# dist_hypergeometric._run_hrua_fptaylor before becoming a real setting.
u_trunc = 1e-8

[geometric]
switch = 0.3333333333333333  # p threshold: inversion below, search above (dist_geometric._SWITCH)
# opt_x_abs_tol_vars (W's tolerance) is intentionally NOT set here: W's
# range scales with N, so a fixed constant would be a no-op for small N and
# far too tight for extreme N. dist_hypergeometric.run() auto-derives
# "W=<10*N>" per case when this isn't overridden -- see the comment there.
